# SQLite for local development (without Docker)
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Development: Use PostgreSQL if DATABASE_HOST is set (Docker), otherwise SQLite
development:
  <% if ENV["DATABASE_HOST"].present? %>
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "balconcito_api_development" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "balconcito" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "balconcito_dev_password" } %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  <% else %>
  <<: *default
  database: storage/development.sqlite3
  <% end %>

# Test: Always use SQLite for faster tests
test:
  <<: *default
  database: storage/test.sqlite3

# PostgreSQL for production
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "balconcito_api_production" } %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
