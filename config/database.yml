# PostgreSQL for development and production
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "balconcito_api_development" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "balconcito" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "balconcito_dev_2024" } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>

# SQLite for fast testing (optional, can use Postgres too)
test:
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: storage/test.sqlite3

# PostgreSQL for production
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "balconcito_api_production" } %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
