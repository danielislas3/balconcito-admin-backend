# PostgreSQL configuration for development with Docker
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: balconcito_api_development
test:
  <<: *default
  database: balconcito_api_test

# Production database configuration
# Configure these environment variables in your production environment
production:
  primary:
    <<: *default
    database: balconcito_api_production
  cache:
    <<: *default
    database: balconcito_api_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: balconcito_api_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: balconcito_api_production
    migrations_paths: db/cable_migrate