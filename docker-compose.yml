version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: balconcito_postgres
    environment:
      POSTGRES_USER: balconcito
      POSTGRES_PASSWORD: balconcito_dev_password
      POSTGRES_DB: balconcito_api_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balconcito"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - balconcito_network

  # Rails Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: balconcito_backend
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_USERNAME: balconcito
      DATABASE_PASSWORD: balconcito_dev_password
      DATABASE_NAME: balconcito_api_development
      REDIS_URL: redis://redis:6379/0
      # Loyverse API
      LOYVERSE_API_TOKEN: ${LOYVERSE_API_TOKEN}
      LOYVERSE_STORE_ID: ${LOYVERSE_STORE_ID}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/rails
      - bundle_cache:/usr/local/bundle
      - rails_cache:/rails/tmp/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - balconcito_network

  # Redis for caching and background jobs
  redis:
    image: redis:7-alpine
    container_name: balconcito_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - balconcito_network

  # Sidekiq for background jobs (optional, for future use)
  # sidekiq:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.dev
  #   container_name: balconcito_sidekiq
  #   command: bundle exec sidekiq
  #   environment:
  #     RAILS_ENV: development
  #     DATABASE_HOST: postgres
  #     DATABASE_USERNAME: balconcito
  #     DATABASE_PASSWORD: balconcito_dev_password
  #     DATABASE_NAME: balconcito_api_development
  #     REDIS_URL: redis://redis:6379/0
  #   volumes:
  #     - ./backend:/rails
  #     - bundle_cache:/usr/local/bundle
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - balconcito_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bundle_cache:
    driver: local
  rails_cache:
    driver: local

networks:
  balconcito_network:
    driver: bridge
