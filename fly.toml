# fly.toml app configuration file generated for backend-green-leaf-3728 on 2025-12-07T02:02:46-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-green-leaf-3728'
primary_region = 'lax'
console_command = '/rails/bin/rails console'

[build]

[env]
  PORT = "80"
  RAILS_ENV = "production"
  RAILS_MAX_THREADS = "5"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  size = 'shared-cpu-1x'

[processes]
app = "./bin/thrust ./bin/rails server"