        - Payroll - Employees
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos exportados
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayrollEmployeeFull'
                  exportedAt:
                    type: string
                    format: date-time
                  version:
                    type: string

  /api/v1/payroll_employees/{employee_id}/weeks:
    get:
      summary: Listar semanas
      tags:
        - Payroll - Weeks
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de semanas
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeks:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayrollWeek'
                  count:
                    type: integer

    post:
      summary: Crear semana
      tags:
        - Payroll - Weeks
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payroll_week:
                  type: object
                  required:
                    - start_date
                  properties:
                    start_date:
                      type: string
                      format: date
                      example: "2025-12-02"
                    weekly_tips:
                      type: number
                      default: 0
      responses:
        '201':
          description: Semana creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  week:
                    $ref: '#/components/schemas/PayrollWeek'
                  message:
                    type: string

  /api/v1/payroll_employees/{employee_id}/weeks/{id}:
    get:
      summary: Obtener semana
      tags:
        - Payroll - Weeks
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "week_id (ej: 2025-W49)"
      responses:
        '200':
          description: Detalles de la semana

    patch:
      summary: Actualizar semana
      tags:
        - Payroll - Weeks
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payroll_week:
                  type: object
                  properties:
                    weekly_tips:
                      type: number
      responses:
        '200':
          description: Semana actualizada

    delete:
      summary: Eliminar semana
      tags:
        - Payroll - Weeks
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Semana eliminada

  /api/v1/payroll_employees/{employee_id}/weeks/{id}/update_schedule:
    patch:
      summary: Actualizar horarios
      description: |
        Actualiza horarios de trabajo para cada día de la semana.
        Recalcula automáticamente: horas trabajadas, horas extras, y pagos.

        **Lógica de descanso:** Si se trabajan ≥5 horas, se descuenta 1h de descanso obligatorio.
      tags:
        - Payroll - Weeks
      security:
        - BearerAuth: []
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - schedule
              properties:
                schedule:
                  type: object
                  description: "Horarios por día (monday, tuesday, etc.)"
                  additionalProperties:
                    type: object
                    properties:
                      entryHour:
                        type: string
                        example: "17"
                      entryMinute:
                        type: string
                        example: "00"
                      exitHour:
                        type: string
                        example: "02"
                      exitMinute:
                        type: string
                        example: "00"
                      isWorking:
                        type: boolean
                        example: true
      responses:
        '200':
          description: Horario actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  week:
                    $ref: '#/components/schemas/PayrollWeek'
                  message:
                    type: string
                    example: "Horario actualizado para 5 días"
